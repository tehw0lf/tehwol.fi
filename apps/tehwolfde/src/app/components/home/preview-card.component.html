<mat-card
  [ngStyle]="cardStyle()"
  role="group"
  aria-roledescription="slide"
  [attr.aria-label]="
    card().title + ' (' + (index() + 1) + '/' + total() + ')'
  "
>
  <mat-card-header>
    <mat-card-title>{{ card().title }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="preview-container">
      @defer (when loadPreview()) {
        <iframe
          [src]="card().previewUrl"
          class="preview-iframe"
          tabindex="-1"
          aria-hidden="true"
          [title]="card().title"
        ></iframe>
      } @placeholder {
        <div class="preview-iframe"></div>
      }
    </div>
    @if (card().description) {
      <p class="description">{{ card().description }}</p>
    }
  </mat-card-content>
  <mat-card-actions>
    <a mat-button [ngStyle]="buttonStyle()" [routerLink]="card().route">
      {{ 'home.tryIt' | translate }}
    </a>
  </mat-card-actions>
</mat-card>
