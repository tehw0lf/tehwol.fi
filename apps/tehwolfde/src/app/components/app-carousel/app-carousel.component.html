<section
  class="carousel"
  role="group"
  aria-roledescription="carousel"
  [attr.aria-label]="'home.apps' | translate"
>
  <div class="carousel-header">
    <h2 class="mat-headline-6">{{ 'home.apps' | translate }}</h2>
    <div class="carousel-controls">
      <button
        mat-icon-button
        type="button"
        [ngStyle]="buttonStyle()"
        [disabled]="!canScrollBack()"
        (click)="scrollBy(-1)"
        [attr.aria-label]="'home.previousApp' | translate"
      >
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button
        mat-icon-button
        type="button"
        [ngStyle]="buttonStyle()"
        [disabled]="!canScrollForward()"
        (click)="scrollBy(1)"
        [attr.aria-label]="'home.nextApp' | translate"
      >
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>
  </div>

  <div
    #track
    class="carousel-track"
    tabindex="0"
    [attr.aria-label]="'home.apps' | translate"
    (scroll)="onScroll()"
    (keydown.arrowLeft)="scrollBy(-1)"
    (keydown.arrowRight)="scrollBy(1)"
  >
    @for (app of apps; track app.route; let i = $index) {
      <mat-card
        class="carousel-slide"
        [ngStyle]="cardStyle()"
        role="group"
        aria-roledescription="slide"
        [attr.aria-label]="app.title + ' (' + (i + 1) + '/' + apps.length + ')'"
      >
        <mat-card-header>
          <mat-card-title>{{ app.title }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="preview-container">
            @defer (when shouldLoad(i)) {
              <iframe
                [src]="app.previewUrl"
                class="preview-iframe"
                tabindex="-1"
                aria-hidden="true"
                [title]="app.title"
              ></iframe>
            } @placeholder {
              <div class="preview-iframe"></div>
            }
          </div>
        </mat-card-content>
        <mat-card-actions>
          <a mat-button [ngStyle]="buttonStyle()" [routerLink]="app.route">
            {{ 'home.tryIt' | translate }}
          </a>
        </mat-card-actions>
      </mat-card>
    }
  </div>
</section>
